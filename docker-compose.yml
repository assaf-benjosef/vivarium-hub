services:
  hub:
    build: .
    ports:
      - "8080:8080"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://viv:pass@db:5432/vivarium
      ALLOWED_USERS: ${ALLOWED_USERS:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: viv
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: vivarium
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viv -d vivarium"]
      interval: 2s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
